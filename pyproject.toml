[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-gate-experiment"
version = "0.7.0"
description = "An audited public benchmark of Jev and GPT-4.1 Mini for CRAG product filtering"
readme = "README.md"
license = "MIT"
authors = [{name = "Tue2day"}]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=16,<24",
  "scikit-learn>=1.4,<2", "scipy>=1.11,<2", "httpx>=0.27,<1", "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
rerank = ["torch>=2.3,<3", "transformers>=4.44,<5", "sentencepiece>=0.2,<1"]
dev = ["pytest>=8,<10"]

[project.scripts]
jev-gate = "jev_gate.cli:main"

[tool.setuptools.packages.find]
include = ["jev_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/Tue2day/crag-gate-benchmark"
Issues = "https://github.com/Tue2day/crag-gate-benchmark/issues"
Report = "https://github.com/Tue2day/crag-gate-benchmark/blob/main/docs/EXPERIMENT_REPORT.md"
