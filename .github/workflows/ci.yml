name: Offline tests and result verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU-only test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Offline regression tests
        run: python -m pytest -q
      - name: Verify calibrated experiment
        run: python -m jev_gate verify-results --experiment v5
      - name: Verify supporting experiment
        run: python -m jev_gate verify-results --experiment v4
